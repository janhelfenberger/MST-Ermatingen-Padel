<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padelgruppe MST Ermatingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141311;
    --bg-elev:#1d1c19;
    --bg-elev-2:#242220;
    --bg-elev-3:#2b2925;
    --yellow:#fff139;
    --yellow-soft:#3a361c;
    --white:#f5f3ec;
    --muted:#9a968a;
    --muted-2:#716d62;
    --line: rgba(245,243,236,0.09);
    --line-strong: rgba(245,243,236,0.16);
    --red:#e2483d;
    --red-soft: rgba(226,72,61,0.15);
    --green:#5fd48a;
    --green-soft: rgba(95,212,138,0.14);
    --radius: 12px;
    --radius-sm: 8px;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(255,241,57,0.06), transparent 55%),
      var(--bg);
    color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button, select, input{font-family:inherit;}
  ::selection{background:var(--yellow); color:#141311;}
  :focus-visible{outline:2px solid var(--yellow); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  #app{max-width:1180px; margin:0 auto; padding:0 16px 70px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative; padding:28px 4px 22px;
    display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:space-between;
    overflow:hidden;
  }
  .hero-dog{position:absolute; right:-30px; top:-10px; width:170px; opacity:0.05; filter:grayscale(1) brightness(3); pointer-events:none;}
  .hero-left{display:flex; gap:16px; align-items:center; z-index:1;}
  .hero-logo{width:60px; height:auto; flex-shrink:0; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));}
  .hero-titles{display:flex; flex-direction:column; gap:3px;}
  .eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--yellow);}
  .hero-title{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:clamp(24px,5.5vw,38px); line-height:1.02; margin:0;}
  .hero-sub{color:var(--muted); font-size:13.5px; margin:0;}
  .hero-stats{display:flex; gap:8px; flex-wrap:wrap; z-index:1;}
  .stat-chip{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 14px; min-width:100px;}
  .stat-chip .num{font-family:var(--font-mono); font-weight:700; font-size:17px; color:var(--yellow); display:block; line-height:1.2;}
  .stat-chip .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}

  .court-line{position:relative; height:1px; background:linear-gradient(90deg, transparent, var(--line-strong) 12%, var(--line-strong) 88%, transparent); margin:4px 4px 18px;}
  .court-line::after{content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; background:var(--yellow); border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--line-strong);}

  /* ---------- TABS ---------- */
  .tabbar{display:flex; gap:2px; flex-wrap:wrap; margin:0 4px 18px; border-bottom:1px solid var(--line);}
  .tabbtn{background:none; border:none; color:var(--muted); font-family:var(--font-display); text-transform:uppercase; letter-spacing:.04em; font-size:13.5px; font-weight:600; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabbtn:hover{color:var(--white);}
  .tabbtn.active{color:var(--yellow); border-bottom-color:var(--yellow);}

  .toolbar{display:flex; align-items:center; gap:12px; margin:0 4px 16px; justify-content:flex-end;}
  .save-indicator{font-size:11.5px; color:var(--muted-2); font-family:var(--font-mono); display:flex; align-items:center; gap:6px;}
  .save-dot{width:7px;height:7px;border-radius:50%; background:var(--muted-2);}
  .save-indicator.saving .save-dot{background:var(--yellow);}
  .save-indicator.saved .save-dot{background:var(--green);}
  .save-indicator.error .save-dot{background:var(--red);}
  .refresh-btn{background:var(--bg-elev); border:1px solid var(--line-strong); color:var(--white); border-radius:var(--radius-sm); padding:6px 12px; font-size:12px; cursor:pointer;}
  .refresh-btn:hover{border-color:var(--yellow); color:var(--yellow);}

  section.panel{margin:0 4px;}
  .card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .card + .card{margin-top:12px;}
  .card h3{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.04em; font-size:14.5px; margin:0 0 12px; color:var(--white);}

  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--muted);}
  .rule-note{font-size:11.5px; color:var(--muted-2); margin:-6px 0 14px;}
  .legend-item{display:flex; align-items:center; gap:6px;}

  /* ---------- AVAILABILITY: DESKTOP TABLE ---------- */
  .only-desktop{display:block;}
  .only-mobile{display:none;}
  .table-scroll{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line);}
  table.avail{border-collapse:collapse; width:100%; min-width:960px; background:var(--bg-elev);}
  table.avail th, table.avail td{padding:8px 8px; text-align:center; border-bottom:1px solid var(--line); font-size:12.5px;}
  table.avail th{font-family:var(--font-display); text-transform:uppercase; font-size:11px; letter-spacing:.03em; color:var(--muted); font-weight:500; background:var(--bg-elev-2); position:sticky; top:0;}
  table.avail td:first-child, table.avail th:first-child{text-align:left; position:sticky; left:0; background:var(--bg-elev-2); min-width:120px; z-index:2;}
  table.avail th:first-child{z-index:3;}
  tr.month-row td{background:var(--bg-elev-3); text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--yellow); padding:5px 8px; position:static;}
  tr.cancelled-row td{opacity:.4;}
  tr.info-row td{background:var(--bg-elev); text-align:left; font-size:11.5px; color:var(--muted); padding:2px 8px 9px; border-bottom:1px solid var(--line);}
  tr.info-row td span.hl{color:var(--white);}
  .ball-btn{background:none; border:none; cursor:pointer; padding:2px; display:inline-flex; border-radius:50%;}
  .ball-btn:hover{transform:scale(1.12);}
  .cancel-x{background:none; border:1px solid var(--line-strong); color:var(--muted-2); border-radius:50%; width:22px; height:22px; font-size:11px; cursor:pointer; line-height:1;}
  .cancel-x:hover{border-color:var(--red); color:var(--red);}
  .cancel-x.is-cancelled{border-color:var(--green); color:var(--green);}

  /* ---------- AVAILABILITY: MOBILE CARDS ---------- */
  .s-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
  .s-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .s-date{font-family:var(--font-display); font-size:15px; text-transform:uppercase;}
  .s-month{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); margin:14px 0 6px 2px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px;}
  .chip{border-radius:20px; padding:7px 13px; font-size:13px; font-weight:500; border:1px solid var(--line-strong); background:none; color:var(--muted); cursor:pointer;}
  .chip.st-neutral{background:var(--yellow-soft); color:var(--yellow); border-color:transparent;}
  .chip.st-green{background:var(--green-soft); color:var(--green); border-color:transparent;}
  .chip.st-red{background:var(--red-soft); color:var(--red); border-color:transparent;}
  .chip.st-declined{background:none; color:var(--muted-2); border-color:var(--line-strong); text-decoration:line-through; opacity:.8;}
  .s-info{font-size:12px; color:var(--muted);}
  .s-info span.hl{color:var(--white);}

  .status-pill{display:inline-block; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:20px;}
  .status-pill.upcoming{background:var(--yellow-soft); color:var(--yellow);}
  .status-pill.today{background:var(--green-soft); color:var(--green);}
  .status-pill.past{background:var(--bg-elev-2); color:var(--muted);}
  .status-pill.cancelled{background:var(--red-soft); color:var(--red);}

  @media (max-width:720px){
    .only-desktop{display:none;}
    .only-mobile{display:block;}
    .hero-dog{display:none;}
  }

  details.past-details{margin-top:16px; border-top:1px solid var(--line); padding-top:12px;}
  details.past-details summary{
    cursor:pointer; list-style:none; font-family:var(--font-display); text-transform:uppercase;
    letter-spacing:.04em; font-size:12.5px; color:var(--muted); padding:4px 0; user-select:none;
  }
  details.past-details summary::-webkit-details-marker{display:none;}
  details.past-details summary::before{content:"▸  "; color:var(--yellow);}
  details.past-details[open] summary::before{content:"▾  ";}
  details.past-details summary:hover{color:var(--white);}
  details.past-details[open] summary{margin-bottom:10px;}
  details.past-details .table-scroll, details.past-details .s-card{opacity:.75;}

  /* ---------- STATISTIK ---------- */
  table.stats{border-collapse:collapse; width:100%;}
  table.stats th, table.stats td{padding:11px 10px; border-bottom:1px solid var(--line); font-size:13.5px; text-align:left;}
  table.stats th{font-family:var(--font-display); text-transform:uppercase; font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:500;}
  table.stats td.num, table.stats th.num{text-align:right; font-family:var(--font-mono);}
  table.stats tr.total-row td{border-top:2px solid var(--line-strong); border-bottom:none; font-weight:600; color:var(--white); padding-top:13px;}
  .rank-badge{display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%; background:var(--bg-elev-2); color:var(--muted); font-family:var(--font-mono); font-size:10.5px; margin-right:8px;}

  /* ---------- INFO ---------- */
  .info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px;}
  .info-item .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:3px;}
  .info-item .val{font-family:var(--font-mono); font-size:15px; color:var(--white);}
  ul.ball-list{list-style:none; margin:0; padding:0;}
  ul.ball-list li{display:flex; gap:10px; align-items:flex-start; padding:6px 0; font-size:13px; color:var(--muted);}
  ul.ball-list li svg{flex-shrink:0; margin-top:2px;}
  ul.ball-list li b{color:var(--white); font-weight:600;}
  .footer-note{text-align:center; color:var(--muted-2); font-size:11.5px; margin-top:26px;}
</style>
</head>

<script>
/* ===================== DATA ===================== */
const PLAYERS = ["Jan","Pascal","Lehner","Nicola","Noel","Sven B.","Sven G.","Gast 1","Gast 2","Gast 3"];
const GUESTS = ["Gast 1","Gast 2","Gast 3"];

function buildSessions(){
  // Built entirely in UTC on purpose: mixing a local-time parse with a UTC
  // serialization (the previous version) silently shifts every date back by
  // one day for anyone west of UTC... no wait, *ahead* of UTC (e.g. Switzerland,
  // UTC+1/+2), turning Thursday 1.10. into Wednesday 30.09. Building and
  // stepping purely in UTC avoids that local-timezone round trip entirely.
  const dates=[];
  let d = new Date(Date.UTC(2026, 9, 1)); // month is 0-indexed: 9 = October
  const end = new Date(Date.UTC(2027, 3, 29)); // 3 = April
  while(d <= end){ dates.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+7); }
  return dates;
}

const CANCELLED_SHARE = GROUP_SESSION_COST / 7; // wird ein Termin abgesagt, tragen alle 7 Fixen die Kosten

// Same fix here: use the browser's own local Y/M/D fields directly instead of
// routing through toISOString() (which converts to UTC and can land on
// yesterday's date for anyone in a timezone ahead of UTC).
function todayISO(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,"0");
  const dd = String(now.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* ===================== PERSISTENCE ===================== */
/* Works in two environments automatically:
   - Inside a Claude.ai artifact preview: uses window.storage (shared, scoped to this chat).
   - Deployed on Netlify: uses the /.netlify/functions/state endpoint (shared, scoped to the site,
     backed by Netlify Blobs) so it truly persists across reloads and across everyone's devices. */
const Persistence = {
  mode: (typeof window !== "undefined" && window.storage) ? "claude" : "netlify",
  async load(){
    if(this.mode === "claude"){
      try{
        const res = await window.storage.get(STORAGE_KEY, true);
        return res && res.value ? JSON.parse(res.value) : null;
      }catch(e){ return null; }
    }
    try{
      const res = await fetch("/.netlify/functions/state");
      if(!res.ok) return null;
      const data = await res.json();
      return data && data.state ? data.state : null;
    }catch(e){ return null; }
  },
  async save(stateObj){
    if(this.mode === "claude"){
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(stateObj), true); return true; }
      catch(e){ return false; }
    }
    try{
      const res = await fetch("/.netlify/functions/state", {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(stateObj)
      });
      return res.ok;
    }catch(e){ return false; }
  }
};

/* ===================== STATE ===================== */
let state = { availability:{}, cancelled:{} };
let currentTab = "verfuegbarkeit";
let saveStatus = "idle";
let loaded = false;

function ensureShape(s){
  return { availability: s.availability || {}, cancelled: s.cancelled || {} };
}

async function loadState(){
  const data = await Persistence.load();
  if(data) state = ensureShape(data);
  loaded = true;
  render();
}

let saveTimer=null;
function scheduleSave(){
  saveStatus="saving"; updateSaveIndicatorOnly();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 350);
}
async function doSave(){
  const ok = await Persistence.save(state);
  saveStatus = ok ? "saved" : "error";
  updateSaveIndicatorOnly();
}
function updateSaveIndicatorOnly(){
  const el = document.getElementById("saveIndicator");
  if(!el) return;
  el.className = "save-indicator " + saveStatus;
  const txt = {idle:"", saving:"speichert …", saved:"gespeichert", error:"nicht erreichbar"}[saveStatus];
  el.querySelector(".save-txt").textContent = txt;
}

/* ===================== DERIVATION (single source of truth) =====================
   Everything — who plays, games played, money used — is computed fresh from
   `availability` + `cancelled` every time, in chronological order. There is no
   separately-stored "confirmed" list, so it can never drift out of sync.
   Rule: once >=4 people are marked available for a Thursday, the 4 with the
   fewest games played so far get the slot; ties are broken by who marked
   themselves available earliest for that date.
   Each availability[date][player] value is one of:
     undefined        -> noch keine Angabe
     a number (ts)     -> kann (verfügbar), Zeitstempel dient als Tie-Break
     "declined"         -> kann nicht (bewusst abgemeldet)
   Money: the field is booked (and paid for) for the whole season regardless
   of attendance. A normal session's group cost (CHF 74.25) is split 4 ways
   among whoever plays. A *cancelled* session still costs the same CHF 74.25 –
   since nobody played, it's split 7 ways across the fixed regulars instead. */
function deriveAll(){
  const gamesCount = {}; PLAYERS.forEach(p => gamesCount[p]=0);
  const moneyCount = {}; PLAYERS.forEach(p => moneyCount[p]=0);
  const perSession = {};
  for(const d of SESSIONS){
    const cancelled = !!state.cancelled[d];
    const availMap = state.availability[d] || {};
    const avail = PLAYERS.filter(p => typeof availMap[p] === "number");
    let confirmed = [];
    const quorum = !cancelled && avail.length >= 4;
    if(quorum){
      const sorted = [...avail].sort((a,b) => {
        const diff = gamesCount[a] - gamesCount[b];
        if(diff !== 0) return diff;
        return (availMap[a]||0) - (availMap[b]||0);
      });
      confirmed = sorted.slice(0,4);
    }
    perSession[d] = { cancelled, avail, confirmed, quorum, availMap };
    if(!cancelled){
      confirmed.forEach(p => { gamesCount[p]++; moneyCount[p] += PER_PLAYER_COST; });
    } else {
      REGULARS.forEach(p => { moneyCount[p] += CANCELLED_SHARE; });
    }
  }
  return { perSession, finalGames: gamesCount, finalMoney: moneyCount };
}

/* ===================== REGISTRATION WINDOW =====================
   "Kann" (verfügbar) darf nur für den nächsten Termin und den danach gesetzt
   werden – also die nächsten 2 Spieltage, unabhängig vom Wochentag von "heute".
   Eine definitive Absage ("kann nicht") ist jederzeit im Voraus möglich. */
const SESSIONS_OPEN_AHEAD = 2;
function withinRegistrationWindow(d){
  const today = todayISO();
  const idx = SESSIONS.findIndex(s => s >= today); // nächster kommender Termin (oder heute)
  if(idx === -1) return true; // Saison vorbei – keine Einschränkung mehr nötig
  const dIdx = SESSIONS.indexOf(d);
  if(dIdx === -1 || dIdx < idx) return true; // vergangene Termine bleiben frei editierbar
  return dIdx <= idx + (SESSIONS_OPEN_AHEAD - 1);
}

/* ===================== FORMAT ===================== */
function chf(n){ return "CHF " + n.toLocaleString("de-CH",{minimumFractionDigits:1, maximumFractionDigits:1}); }
function dateD1(d){ const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("de-CH",{weekday:"short", day:"2-digit", month:"2-digit"}); }
function monthLabel(d){ const dt=new Date(d+"T00:00:00"); const s=dt.toLocaleDateString("de-CH",{month:"long", year:"numeric"}); return s.charAt(0).toUpperCase()+s.slice(1); }
function sessionStatus(d, cancelled){
  if(cancelled) return "cancelled";
  if(d === todayISO()) return "today";
  return d < todayISO() ? "past" : "upcoming";
}

/* ===================== BALL ICON ===================== */
function ballSVG(kind, size){
  size = size || 20;
  const colorMap = {empty:"none", neutral:"var(--yellow)", green:"var(--green)", red:"var(--red)", declined:"none"};
  const fill = colorMap[kind] || "none";
  const showSeam = kind==="neutral" || kind==="green" || kind==="red";
  const showStrike = kind==="declined";
  return '<svg viewBox="0 0 32 32" width="'+size+'" height="'+size+'" aria-hidden="true">' +
    '<circle cx="16" cy="16" r="14" fill="'+fill+'" stroke="rgba(245,243,236,.35)" stroke-width="1.6"/>' +
    (showSeam ? '<path d="M4 11 Q16 3 28 11" fill="none" stroke="rgba(20,19,17,.55)" stroke-width="1.7"/><path d="M4 21 Q16 29 28 21" fill="none" stroke="rgba(20,19,17,.55)" stroke-width="1.7"/>' : '') +
    (showStrike ? '<line x1="8" y1="8" x2="24" y2="24" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>' : '') +
    '</svg>';
}
function stateOf(sess, player){
  if(sess.cancelled) return "empty";
  const val = sess.availMap[player];
  if(val === "declined") return "declined";
  if(typeof val !== "number") return "empty";
  if(!sess.quorum) return "neutral";
  return sess.confirmed.includes(player) ? "green" : "red";
}

/* ===================== SHELL ===================== */
function totalCancelledSessions(){ return SESSIONS.filter(d => state.cancelled[d]).length; }
function totalActiveSessions(){ return SESSIONS.length - totalCancelledSessions(); }
// Das Feld ist für die ganze Saison fix gebucht (und vom Verein bezahlt) – daran
// ändert eine Absage nichts, es verschiebt nur, wer die Kosten dieses einen
// Termins trägt (4 Spielende statt der 7 Fixen bei Absage). Darum sind die
// Saison-Totale hier bewusst fix und hängen nicht von Absagen ab.
function totalSeasonCost(){ return SESSIONS.length * SESSION_COST; }
function totalClubShare(){ return totalSeasonCost() * CLUB_PCT; }
function totalGroupShare(){ return totalSeasonCost() * (1-CLUB_PCT); }

function render(){
  const app = document.getElementById("app");
  if(!loaded){
    app.innerHTML = '<div style="padding:70px 0; text-align:center; color:var(--muted); font-family:var(--font-mono);">lade daten …</div>';
    return;
  }
  const derived = deriveAll();
  app.innerHTML = renderHero() + renderToolbar() + renderTabbar() + '<section class="panel" id="panelContent"></section>' + renderFooter();
  document.getElementById("panelContent").innerHTML = renderTabContent(derived);
  updateSaveIndicatorOnly();
  attachHandlers();
}

function renderHero(){
  return `
  <div class="hero">
    <img class="hero-dog" src="${DOG_SRC}" alt="">
    <div class="hero-left">
      <img class="hero-logo" src="${LOGO_SRC}" alt="MST Ermatingen Wappen">
      <div class="hero-titles">
        <span class="eyebrow">Padelgruppe · Saison 26/27</span>
        <h1 class="hero-title">MST Ermatingen</h1>
        <p class="hero-sub">Padel am See, Kreuzlingen · jeden Donnerstag 18:00–19:30</p>
      </div>
    </div>
    <div class="hero-stats">
      <div class="stat-chip"><span class="num">${SESSIONS.length}</span><span class="lbl">Spieltage</span></div>
      <div class="stat-chip"><span class="num">${chf(totalGroupShare())}</span><span class="lbl">Anteil Gruppe</span></div>
      <div class="stat-chip"><span class="num">${chf(totalClubShare())}</span><span class="lbl">Anteil Verein</span></div>
    </div>
  </div>
  <div class="court-line"></div>`;
}

function renderToolbar(){
  return `
  <div class="toolbar">
    <span class="save-indicator" id="saveIndicator"><span class="save-dot"></span><span class="save-txt"></span></span>
    <button class="refresh-btn" id="refreshBtn" type="button">↻ Aktualisieren</button>
  </div>`;
}

function renderTabbar(){
  const tabs = [["verfuegbarkeit","Verfügbarkeit"], ["statistik","Statistik"], ["info","Info"]];
  return '<div class="tabbar">' + tabs.map(([id,label]) =>
    `<button class="tabbtn ${currentTab===id?"active":""}" data-tab="${id}" type="button">${label}</button>`
  ).join("") + '</div>';
}

function renderFooter(){
  return `<p class="footer-note">Daten werden geteilt gespeichert – alle aus der Gruppe sehen und bearbeiten dieselbe Liste. Bei Änderungen von anderen ggf. auf „Aktualisieren" klicken.</p>`;
}

function renderTabContent(derived){
  if(currentTab==="verfuegbarkeit") return renderAvailabilityTab(derived);
  if(currentTab==="statistik") return renderStatistikTab(derived);
  if(currentTab==="info") return renderInfoTab(derived);
  return "";
}

/* ===================== TAB 1: VERFÜGBARKEIT ===================== */
function infoLine(sess){
  if(sess.cancelled) return `<span>Abgesagt – Feldkosten (${chf(GROUP_SESSION_COST)}) werden zu gleichen Teilen auf alle 7 Fixen aufgeteilt (je ${chf(CANCELLED_SHARE)}).</span>`;
  if(!sess.quorum){
    return `<span>${sess.avail.length}/4 angemeldet – wartet auf weitere Anmeldungen.</span>`;
  }
  const rest = sess.avail.filter(p => !sess.confirmed.includes(p));
  let txt = `Spielt: <span class="hl">${sess.confirmed.join(", ")}</span>`;
  if(rest.length) txt += ` · Ersatz: ${rest.join(", ")}`;
  return `<span>${txt}</span>`;
}

function buildTableRows(dates, derived){
  let rows = ""; let lastMonth = "";
  for(const d of dates){
    const sess = derived.perSession[d];
    const m = monthLabel(d);
    if(m !== lastMonth){ rows += `<tr class="month-row"><td colspan="${PLAYERS.length+2}">${m}</td></tr>`; lastMonth = m; }
    const within = withinRegistrationWindow(d);
    rows += `<tr class="${sess.cancelled?"cancelled-row":""}"><td>${dateD1(d)}</td>`;
    for(const p of PLAYERS){
      const kind = stateOf(sess, p);
      const tip = !within ? `${p} – "Kann" erst für die nächsten 2 Termine, Absage schon jetzt möglich` : p;
      rows += `<td><button class="ball-btn" data-action="toggle-avail" data-date="${d}" data-player="${p}" ${sess.cancelled?"disabled":""} title="${tip}">${ballSVG(kind)}</button></td>`;
    }
    rows += `<td><button class="cancel-x ${sess.cancelled?"is-cancelled":""}" data-action="toggle-cancel" data-date="${d}" title="${sess.cancelled?"Reaktivieren":"Absagen"}">${sess.cancelled?"↺":"✕"}</button></td></tr>`;
    rows += `<tr class="info-row"><td colspan="${PLAYERS.length+2}">${infoLine(sess)}</td></tr>`;
  }
  return rows;
}

function buildCards(dates, derived){
  let cards = ""; let lastMonth = "";
  for(const d of dates){
    const sess = derived.perSession[d];
    const m = monthLabel(d);
    if(m !== lastMonth){ cards += `<div class="s-month">${m}</div>`; lastMonth = m; }
    const status = sessionStatus(d, sess.cancelled);
    const statusLabel = {upcoming:"Kommend", today:"Heute", past:"Vergangen", cancelled:"Abgesagt"}[status];
    const within = withinRegistrationWindow(d);
    const chips = PLAYERS.map(p => {
      const kind = stateOf(sess, p);
      const cls = kind==="green"?"st-green":kind==="red"?"st-red":kind==="neutral"?"st-neutral":kind==="declined"?"st-declined":"";
      const tip = !within ? `title="\u201eKann\u201c erst für die nächsten 2 Termine, Absage schon jetzt möglich"` : "";
      return `<button class="chip ${cls}" data-action="toggle-avail" data-date="${d}" data-player="${p}" ${sess.cancelled?"disabled":""} ${tip}>${p}</button>`;
    }).join("");
    cards += `
    <div class="s-card">
      <div class="s-card-head">
        <div><span class="s-date">${dateD1(d)}</span> <span class="status-pill ${status}">${statusLabel}</span></div>
        <button class="cancel-x ${sess.cancelled?"is-cancelled":""}" data-action="toggle-cancel" data-date="${d}">${sess.cancelled?"↺":"✕"}</button>
      </div>
      <div class="chips">${chips}</div>
      <div class="s-info">${infoLine(sess)}</div>
    </div>`;
  }
  return cards;
}

function renderAvailabilityTab(derived){
  const legend = `
    <div class="legend">
      <span class="legend-item">${ballSVG("neutral",15)} angemeldet, Gruppe noch offen</span>
      <span class="legend-item">${ballSVG("green",15)} bestätigt, spielt mit</span>
      <span class="legend-item">${ballSVG("red",15)} angemeldet, diesmal Ersatz</span>
      <span class="legend-item">${ballSVG("declined",15)} kann nicht (weiss ich schon)</span>
    </div>
    <p class="rule-note">1× klicken = kann, 2× = kann nicht, 3× = zurück auf leer. „Kann" lässt sich für die nächsten 2 Termine setzen, eine definitive Absage jederzeit weiter im Voraus.</p>`;

  const today = todayISO();
  const futureDates = SESSIONS.filter(d => d >= today);
  const pastDates = SESSIONS.filter(d => d < today);
  const header = `<tr><th>Datum</th>${PLAYERS.map(p=>`<th>${p}</th>`).join("")}<th></th></tr>`;

  const futureDesktop = `<div class="table-scroll"><table class="avail"><thead>${header}</thead><tbody>${buildTableRows(futureDates, derived)}</tbody></table></div>`;
  const futureCards = buildCards(futureDates, derived);
  const emptyFuture = futureDates.length===0 ? '<p style="color:var(--muted); font-size:13px;">Saison ist vorbei – alle Termine stehen unten bei „Vergangene Termine".</p>' : "";

  let pastBlock = "";
  if(pastDates.length){
    const pastDesktop = `<div class="table-scroll"><table class="avail"><thead>${header}</thead><tbody>${buildTableRows(pastDates, derived)}</tbody></table></div>`;
    const pastCards = buildCards(pastDates, derived);
    pastBlock = `
    <details class="past-details only-desktop">
      <summary>Vergangene Termine anzeigen (${pastDates.length})</summary>
      ${pastDesktop}
    </details>
    <details class="past-details only-mobile">
      <summary>Vergangene Termine anzeigen (${pastDates.length})</summary>
      ${pastCards}
    </details>`;
  }

  return `
  <div class="card">
    ${legend}
    ${emptyFuture}
    <div class="only-desktop">${futureDesktop}</div>
    <div class="only-mobile">${futureCards}</div>
    ${pastBlock}
  </div>`;
}

/* ===================== TAB 2: STATISTIK ===================== */
function renderStatistikTab(derived){
  const rows = PLAYERS.map(p => ({ player:p, games: derived.finalGames[p], money: derived.finalMoney[p] }))
    .sort((a,b) => a.games - b.games);
  const totalGames = rows.reduce((s,r)=>s+r.games,0);
  const totalMoney = rows.reduce((s,r)=>s+r.money,0);
  const cancelledN = totalCancelledSessions();

  const body = rows.map((r,i) => `
    <tr>
      <td><span class="rank-badge">${i+1}</span>${r.player}</td>
      <td class="num">${r.games}</td>
      <td class="num">${chf(r.money)}</td>
    </tr>`).join("");

  const cancelNote = cancelledN>0
    ? `<p class="rule-note">Bei ${cancelledN} abgesagten Termin${cancelledN===1?"":"en"} tragen alle 7 Fixen die Kosten zu gleichen Teilen (${chf(CANCELLED_SHARE)} pro Person und Absage) – ist oben schon eingerechnet.</p>`
    : "";

  return `
  <div class="card">
    <h3>Rangliste – wenigste Spiele oben (hat Vorrang)</h3>
    <table class="stats">
      <thead><tr><th>Spieler:in</th><th class="num">Spiele</th><th class="num">Geld gebraucht</th></tr></thead>
      <tbody>${body}
        <tr class="total-row"><td>Total Gruppe</td><td class="num">${totalGames}</td><td class="num">${chf(totalMoney)}</td></tr>
      </tbody>
    </table>
    ${cancelNote}
  </div>`;
}

/* ===================== TAB 3: INFO ===================== */
function renderInfoTab(){
  return `
  <div class="card">
    <h3>Saison auf einen Blick</h3>
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Verein</div><div class="val">MST Ermatingen</div></div>
      <div class="info-item"><div class="lbl">Ort</div><div class="val">Padel am See, Kreuzlingen</div></div>
      <div class="info-item"><div class="lbl">Zeit</div><div class="val">Donnerstag, 18:00–19:30</div></div>
      <div class="info-item"><div class="lbl">Zeitraum</div><div class="val">01.10.2026 – 29.04.2027</div></div>
      <div class="info-item"><div class="lbl">Spieltage geplant</div><div class="val">${SESSIONS.length}</div></div>
      <div class="info-item"><div class="lbl">Davon abgesagt</div><div class="val">${totalCancelledSessions()}</div></div>
    </div>
  </div>
  <div class="card">
    <h3>Kosten &amp; Abrechnung</h3>
    <div class="info-grid">
      <div class="info-item"><div class="lbl">Preis pro Feldstunde</div><div class="val">${chf(HOURLY_RATE)}</div></div>
      <div class="info-item"><div class="lbl">Pro Spieltag (1.5 Std.)</div><div class="val">${chf(SESSION_COST)}</div></div>
      <div class="info-item"><div class="lbl">Pro Spieler (bei 4)</div><div class="val">${chf(PER_PLAYER_COST)}</div></div>
      <div class="info-item"><div class="lbl">Pro Fixem bei Absage (7)</div><div class="val">${chf(CANCELLED_SHARE)}</div></div>
      <div class="info-item"><div class="lbl">Total Saison (Feld)</div><div class="val">${chf(totalSeasonCost())}</div></div>
      <div class="info-item"><div class="lbl">Bleibt beim Verein (10%)</div><div class="val">${chf(totalClubShare())}</div></div>
      <div class="info-item"><div class="lbl">Gruppe zahlt zurück (90%)</div><div class="val">${chf(totalGroupShare())}</div></div>
    </div>
    <p style="font-size:12.5px; color:var(--muted); margin:14px 0 0;">Der Verein legt das Feld für die ganze Saison im Voraus aus und bucht es fix – das gilt auch für abgesagte Termine, die Feldmiete fällt trotzdem an. Am Ende rechnet jede Person mit dem Verein ab: normalerweise nach Anzahl gespielter Termine (${chf(PER_PLAYER_COST)} pro Spieltag), bei einer Absage tragen stattdessen alle 7 Fixen den Termin gemeinsam (${chf(CANCELLED_SHARE)} pro Person) – sichtbar unter „Statistik". Die 10% Vereinsanteil bleiben in jedem Fall beim Verein.</p>
  </div>
  <div class="card">
    <h3>So funktioniert der Vorrang</h3>
    <ul class="ball-list">
      <li>${ballSVG("neutral",17)}<span>Jede Person klickt unter „Verfügbarkeit" auf ihr Feld: <b>1× = kann</b>, <b>2× = kann nicht</b> (durchgestrichen), <b>3× = wieder leer</b>.</span></li>
      <li>${ballSVG("green",17)}<span>Sobald für einen Donnerstag <b>4 oder mehr</b> "kann" angemeldet sind, bestimmt die Seite automatisch die 4 Spielenden: Vorrang haben jene mit den <b>wenigsten bisherigen Spielen</b>.</span></li>
      <li>${ballSVG("red",17)}<span>Bei Gleichstand entscheidet, wer sich <b>zuerst</b> angemeldet hat. Die übrigen bleiben als Ersatz markiert und rutschen automatisch nach, falls jemand sich wieder abmeldet.</span></li>
      <li>${ballSVG("declined",17)}<span>"Kann" lässt sich nur für die <b>nächsten 2 Termine</b> setzen. Eine definitive Absage ("kann nicht") kann dagegen schon viel weiter im Voraus eingetragen werden, z. B. wegen Ferien.</span></li>
      <li>${ballSVG("neutral",17)}<span><b>Gast 1–3</b> sind für den Fall, dass an einem Donnerstag zu wenige der 7 Fixen können: einfach einen Gast mit anmelden, damit die 4er-Gruppe wieder voll wird. Sie zählen sonst genau gleich wie alle anderen (Spiele, Kosten).</span></li>
      <li>${ballSVG("red",17)}<span>Wird ein Termin über den <b>✕-Button</b> abgesagt, tragen automatisch <b>alle 7 Fixen</b> die Kosten dieses Termins zu gleichen Teilen – die Gäste nicht, und niemand bekommt dafür ein gezähltes Spiel.</span></li>
    </ul>
  </div>`;
}

/* ===================== EVENTS ===================== */
function attachHandlers(){
  document.getElementById("refreshBtn").addEventListener("click", () => { loaded=false; render(); loadState(); });
  document.querySelectorAll(".tabbtn").forEach(btn => btn.addEventListener("click", () => { currentTab = btn.dataset.tab; render(); }));

  const panel = document.getElementById("panelContent");
  panel.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if(!t) return;
    const action = t.dataset.action, d = t.dataset.date, p = t.dataset.player;
    if(action==="toggle-avail"){
      if(!state.availability[d]) state.availability[d]={};
      const cur = state.availability[d][p];
      if(withinRegistrationWindow(d)){
        // Zyklus: leer -> kann (Ball/Chip farbig) -> kann nicht (durchgestrichen) -> leer
        if(cur === undefined) state.availability[d][p] = Date.now();
        else if(typeof cur === "number") state.availability[d][p] = "declined";
        else delete state.availability[d][p];
      } else {
        // Nicht unter den nächsten 2 Terminen: nur definitive Absage möglich, kein "kann".
        // Zyklus: leer -> kann nicht -> leer
        if(cur === undefined) state.availability[d][p] = "declined";
        else delete state.availability[d][p];
      }
      scheduleSave(); render();
    } else if(action==="toggle-cancel"){
      state.cancelled[d] = !state.cancelled[d];
      scheduleSave(); render();
    }
  });
}

/* ===================== INIT ===================== */
loadState();
</script>
</body>
</html>
